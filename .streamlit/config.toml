[theme]
base = "light"
primaryColor = "#E60116"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F4"
textColor = "#1E1E1E"
# Inter (proche d'Arial, plus moderne), hébergée avec l'appli dans static/ ;
# Arial en secours. Le bordereau Excel / PDF garde Arial.
font = "Inter, Arial, sans-serif"

# Inter variable (graisses 100 à 900, taille optique automatique), sous-ensembles
# « latin » et « latin étendu » de Fontsource. Licence : static/Inter-OFL.txt.
[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-opsz-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-ext-opsz-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-opsz-italic.woff2"
weight = "100 900"
style = "italic"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-ext-opsz-italic.woff2"
weight = "100 900"
style = "italic"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[server]
runOnSave = true
# Sert le dossier static/ (police Inter) à l'adresse app/static/.
enableStaticServing = true

[client]
# Pas de détail technique affiché en cas d'erreur (Community Cloud n'a pas d'options de lancement).
showErrorDetails = "type"

[browser]
# Pas de statistiques d'usage envoyées à Streamlit (données de projets clients).
gatherUsageStats = false
